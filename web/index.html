<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LunarCade Hub</title>
<meta name="theme-color" content="#081423">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LunarCade">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #081423; overscroll-behavior: none; }
  body { position: fixed; inset: 0; }
  #game { position: absolute; left: 0; top: 0; border: 0; display: block; transform-origin: 0 0; background: #081423; }
</style>
</head>
<body>
<iframe id="game" title="LunarCade Hub" allow="autoplay; fullscreen; screen-wake-lock" scrolling="no"></iframe>
<script>
// The game (game.html) is laid out for screens of at least 900 × 520 and asks players to rotate below
// that or in portrait. So it runs in a frame that is always landscape and at least that big, scaled down
// to fit the screen and turned sideways when the phone is held upright, like a native landscape game.
// Touches are mapped into the turned frame by the browser, so the game itself needs no changes.
(function () {
  const MIN_W = 900, MIN_H = 520;
  const frame = document.getElementById('game');
  // Cloudflare serves pages without the .html ending (game.html redirects to /game), and the offline
  // cache can't replay a redirect, so the website asks for /game. The Android app keeps the file name.
  const web = /^https?:$/.test(location.protocol) && !window.Capacitor;
  frame.src = (web ? 'game' : 'game.html') + location.search + location.hash;

  function fit() {
    const w = innerWidth, h = innerHeight;
    if (!w || !h) return;
    const upright = h > w;
    const long = upright ? h : w, short = upright ? w : h;
    const scale = Math.min(1, long / MIN_W, short / MIN_H);
    frame.style.width = long / scale + 'px';
    frame.style.height = short / scale + 'px';
    // Upright: the game's top edge runs along the right side of the screen.
    frame.style.transform = upright ? `translateX(${w}px) rotate(90deg) scale(${scale})` : `scale(${scale})`;
    document.documentElement.dataset.upright = upright;
  }

  fit();
  addEventListener('resize', fit);
  if (window.visualViewport) visualViewport.addEventListener('resize', fit);
  addEventListener('orientationchange', () => setTimeout(fit, 300));

  // Keyboard players type into the game, so keep the focus inside the frame.
  const focus = () => frame.contentWindow && frame.contentWindow.focus();
  frame.addEventListener('load', focus);
  addEventListener('focus', focus);
})();
</script>
</body>
</html>
