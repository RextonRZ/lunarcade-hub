# Push a tag like v2.9.8 and GitHub builds the downloadable apps and attaches them to a Release:
#   git tag v2.9.8 && git push origin v2.9.8
name: Release apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx electron-builder --publish never
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.exe
            dist/*.dmg

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx cap sync android
      # The permanent release key comes from repository secrets, so every APK can update the last one.
      # Without the secrets Gradle builds an unsigned APK and the copy below fails, so nothing unsigned ships.
      - name: Write signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lunarcade-release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=lunarcade\nkeyPassword=%s\n' "$RUNNER_TEMP/lunarcade-release.jks" "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > "$RUNNER_TEMP/keystore.properties"
          echo "LUNARCADE_KEYSTORE_PROPERTIES=$RUNNER_TEMP/keystore.properties" >> "$GITHUB_ENV"
      - run: ./gradlew assembleRelease
        working-directory: android
      - run: cp android/app/build/outputs/apk/release/app-release.apk "LunarCade-${GITHUB_REF_NAME#v}-android.apk"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: LunarCade-*-android.apk
